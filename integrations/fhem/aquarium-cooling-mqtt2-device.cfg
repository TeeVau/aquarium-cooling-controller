# FHEM MQTT2 integration for the aquarium cooling controller.
#
# Firmware target state on 2026-05-14:
# - MQTT telemetry is implemented
# - staged water-only control is the target model
# - all normal staged-control parameters are intended to be remotely adjustable
# - OTA maintenance-window control is exposed through MQTT
# - temperature payloads are rounded to one decimal place at the firmware
#   output boundary; internal control values remain full precision
# - firmware publishes a full telemetry snapshot every 60 seconds by default
#   and sends immediate extra publishes for controller/fault state changes and
#   accepted remote configuration updates
#
# Topic root used here: aquarium_cooling
# This matches the verified local bench override in network_config.local.h.
# If your firmware uses the committed default root topic, replace
# "aquarium_cooling" with "aquarium/cooling" in this file.
#
# Optional broker gateway, if FHEM connects to an external broker.
# Skip this block if you already have an MQTT2_CLIENT or MQTT2_SERVER IODev.
#
# defmod MQTT2_BROKER MQTT2_CLIENT <broker-host>:1883
# attr MQTT2_BROKER room MQTT
# attr MQTT2_BROKER subscriptions aquarium_cooling/#
#
# If you use MQTT credentials, configure them on the MQTT2_BROKER device in
# FHEM according to your broker setup.
#
# Recommended DBLog baseline for long-running production history:
# attr LogDB DbLogSelectionMode Include
# attr AquariumCooling DbLogInclude water_temp_c:300,target_temp_c:300,fan_pwm_percent:300,controller_mode,fan_fault,alarm_code,fault_severity,fault_response,availability
#
# Conservative field profile for a 120-liter tank:
# attr AquariumCooling event-on-change-reading .*
# attr AquariumCooling event-min-interval water_temp_c:1800,target_temp_c:86400,fan_pwm_percent:300
# attr AquariumCooling DbLogInclude water_temp_c:1800,target_temp_c:86400,fan_pwm_percent:300,controller_mode,fan_fault,alarm_code,fault_severity,fault_response,availability

defmod AquariumCooling MQTT2_DEVICE aq-cooling-controller
attr AquariumCooling IODev MQTT2_BROKER
attr AquariumCooling alias Aquarium Cooling Controller
attr AquariumCooling room Aquarium
attr AquariumCooling group Kuehlung
attr AquariumCooling comment ESP32 aquarium cooling controller; local control remains authoritative while MQTT can adjust validated staged-control settings.
attr AquariumCooling icon temp_temperature
attr AquariumCooling event-on-change-reading .*
attr AquariumCooling stateFormat {\
my $availability = ReadingsVal($name,"availability","offline");;\
my $otaState = ReadingsVal($name,"ota_state","disabled");;\
my $otaWindowActive = ReadingsVal($name,"ota_window_active","false");;\
my $alarmCode = ReadingsVal($name,"alarm_code","none");;\
my $faultSeverity = ReadingsVal($name,"fault_severity","none");;\
my $coolingDegraded = ReadingsVal($name,"cooling_degraded","false");;\
my $controllerMode = ReadingsVal($name,"controller_mode","unknown");;\
my $status = "Bereit";;\
if ($availability ne "online") {\
  $status = "Offline";;\
} elsif ($otaWindowActive eq "true" && $otaState eq "armed") {\
  $status = "OTA bereit";;\
} elsif ($otaWindowActive eq "true" && $otaState eq "uploading") {\
  $status = "OTA Upload";;\
} elsif ($faultSeverity eq "critical" || $alarmCode ne "none") {\
  $status = "Alarm";;\
} elsif ($controllerMode eq "water-sensor-fallback") {\
  $status = "Fallback";;\
} elsif ($coolingDegraded eq "true") {\
  $status = "Warnung";;\
} elsif ($controllerMode eq "fan-high") {\
  $status = "Kuehlt hoch";;\
} elsif ($controllerMode eq "fan-low") {\
  $status = "Kuehlt";;\
}\
sprintf("%s | Wasser %s C | Ziel %s C | Luefter %s %% | MQTT %s",\
  $status,\
  ReadingsVal($name,"water_temp_c","?"),\
  ReadingsVal($name,"target_temp_c","?"),\
  ReadingsVal($name,"fan_pwm_percent","?"),\
  $availability)\
}
attr AquariumCooling devStateIcon {\
my $availability = ReadingsVal($name,"availability","offline");;\
my $otaState = ReadingsVal($name,"ota_state","disabled");;\
my $otaWindowActive = ReadingsVal($name,"ota_window_active","false");;\
my $alarmCode = ReadingsVal($name,"alarm_code","none");;\
my $faultSeverity = ReadingsVal($name,"fault_severity","none");;\
my $fanFault = ReadingsVal($name,"fan_fault","false");;\
my $waterSensorOk = ReadingsVal($name,"water_sensor_ok","true");;\
my $coolingDegraded = ReadingsVal($name,"cooling_degraded","false");;\
my $controllerMode = ReadingsVal($name,"controller_mode","unknown");;\
my ($icon,$status) = ('temp_temperature@blue',"Bereit");;\
if ($availability ne "online") {\
  ($icon,$status) = ('lan_rs485@red',"Offline");;\
} elsif ($otaWindowActive eq "true" && $otaState eq "armed") {\
  ($icon,$status) = ('system_fhem_reboot@cornflowerblue',"OTA bereit");;\
} elsif ($otaWindowActive eq "true" && $otaState eq "uploading") {\
  ($icon,$status) = ('system_fhem_reboot@orange',"OTA Upload");;\
} elsif ($faultSeverity eq "critical" || $alarmCode ne "none" || $fanFault eq "true" || $waterSensorOk ne "true") {\
  ($icon,$status) = ('message_attention@red',"Alarm");;\
} elsif ($coolingDegraded eq "true" || $controllerMode eq "water-sensor-fallback") {\
  ($icon,$status) = ('message_attention@darkorange',"Fallback");;\
} elsif ($controllerMode eq "fan-high") {\
  ($icon,$status) = ('temp_temperature@red',"Kuehlt hoch");;\
} elsif ($controllerMode eq "fan-low") {\
  ($icon,$status) = ('temp_temperature@orange',"Kuehlt");;\
}\
my $summary = sprintf("%s | Wasser %s C | Ziel %s C | Luefter %s %% | MQTT %s",\
  $status,\
  ReadingsVal($name,"water_temp_c","?"),\
  ReadingsVal($name,"target_temp_c","?"),\
  ReadingsVal($name,"fan_pwm_percent","?"),\
  $availability);;\
'<div style="display:flex;align-items:center;gap:0.4em;">' . FW_makeImage($icon,"status") . '<span>' . $summary . '</span></div>'\
}
attr AquariumCooling readingList aquarium_cooling/state/water_temp_c:.* water_temp_c\
aquarium_cooling/state/target_temp_c:.* target_temp_c\
aquarium_cooling/state/cooling_on_delta_c:.* cooling_on_delta_c\
aquarium_cooling/state/cooling_off_delta_c:.* cooling_off_delta_c\
aquarium_cooling/state/high_cooling_delta_c:.* high_cooling_delta_c\
aquarium_cooling/state/fan_low_pwm_percent:.* fan_low_pwm_percent\
aquarium_cooling/state/fan_high_pwm_percent:.* fan_high_pwm_percent\
aquarium_cooling/state/fan_pwm_percent:.* fan_pwm_percent\
aquarium_cooling/state/fan_rpm:.* fan_rpm\
aquarium_cooling/state/controller_mode:.* controller_mode\
aquarium_cooling/diagnostic/expected_rpm:.* expected_rpm\
aquarium_cooling/diagnostic/rpm_tolerance:.* rpm_tolerance\
aquarium_cooling/diagnostic/rpm_error:.* rpm_error\
aquarium_cooling/diagnostic/plausibility_active:.* plausibility_active\
aquarium_cooling/diagnostic/remote_config_accept_count:.* remote_config_accept_count\
aquarium_cooling/diagnostic/remote_config_reject_count:.* remote_config_reject_count\
aquarium_cooling/status/fan_plausible:.* fan_plausible\
aquarium_cooling/status/fan_fault:.* fan_fault\
aquarium_cooling/status/water_sensor_ok:.* water_sensor_ok\
aquarium_cooling/status/cooling_degraded:.* cooling_degraded\
aquarium_cooling/status/service_required:.* service_required\
aquarium_cooling/status/alarm_code:.* alarm_code\
aquarium_cooling/status/fault_severity:.* fault_severity\
aquarium_cooling/status/fault_response:.* fault_response\
aquarium_cooling/status/firmware_version:.* firmware_version\
aquarium_cooling/status/network_ip:.* network_ip\
aquarium_cooling/status/ota_state:.* ota_state\
aquarium_cooling/status/ota_message:.* ota_message\
aquarium_cooling/status/ota_window_active:.* ota_window_active\
aquarium_cooling/status/ota_upload_url:.* ota_upload_url\
aquarium_cooling/status/remote_config_last_result:.* remote_config_last_result\
aquarium_cooling/status/remote_config_last_key:.* remote_config_last_key\
aquarium_cooling/status/remote_config_last_detail:.* remote_config_last_detail\
aquarium_cooling/status/availability:.* availability

attr AquariumCooling setList target_temp_c:slider,15,0.1,35 aquarium_cooling/set/target_temp_c $EVTPART1\
cooling_on_delta_c:slider,0.1,0.1,3.0 aquarium_cooling/set/cooling_on_delta_c $EVTPART1\
cooling_off_delta_c:slider,-3.0,0.1,-0.1 aquarium_cooling/set/cooling_off_delta_c $EVTPART1\
high_cooling_delta_c:slider,0.2,0.1,5.0 aquarium_cooling/set/high_cooling_delta_c $EVTPART1\
fan_low_pwm_percent:slider,15,1,60 aquarium_cooling/set/fan_low_pwm_percent $EVTPART1\
fan_high_pwm_percent:slider,20,1,100 aquarium_cooling/set/fan_high_pwm_percent $EVTPART1\
ota_enable:true,false aquarium_cooling/set/ota_enable $EVTPART1
